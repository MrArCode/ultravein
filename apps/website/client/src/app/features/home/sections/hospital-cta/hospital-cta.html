<section class="uv-section cta" aria-labelledby="cta-title">
  <div class="uv-container">
    <div class="cta__panel">
      <div class="cta__text">
        <p class="uv-eyebrow cta__eyebrow">Dla szpitali i placówek</p>
        <h2 id="cta-title">Przeszkolimy cały zespół na miejscu</h2>
        <p>
          Jednodniowe szkolenia zamknięte dla grup od 6 do 18 osób. Zapewniamy sprzęt, fantomy i
          aparaty USG. Napisz, czego potrzebuje Twój zespół, a przygotujemy ofertę.
        </p>
      </div>
      <div class="cta__actions">
        <a class="uv-button uv-button--light" routerLink="/dla-placowek" fragment="zapytanie">
          Zapytaj o szkolenie
        </a>
        <a class="cta__phone" [href]="company.phoneHref">lub zadzwoń: {{ company.phone }}</a>
      </div>
    </div>
  </div>
</section>
