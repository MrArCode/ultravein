<section id="formy" class="uv-section uv-section--alt" aria-labelledby="formats-title">
  <div class="uv-container">
    <div class="uv-section-header">
      <p class="uv-eyebrow">Formy szkoleń</p>
      <h2 id="formats-title">Wybierz sposób nauki</h2>
      <p>
        Praktyka na sprzęcie, wiedza na żywo z instruktorami albo szkolenie całego zespołu w Twoim
        szpitalu.
      </p>
    </div>

    <ul class="formats">
      @for (offer of offers; track offer.title) {
        <li class="format uv-surface uv-clickable">
          <img
            class="format__image"
            [ngSrc]="offer.image"
            [width]="offer.imageWidth"
            [height]="offer.imageHeight"
            [alt]="offer.imageAlt"
          />
          <div class="format__body">
            <h3 class="format__title">
              <a class="uv-cover-link" [href]="offer.linkUrl">{{ offer.title }}</a>
            </h3>
            <p>{{ offer.description }}</p>
            <p class="format__footer">
              <span class="format__price">{{ offer.priceNote }}</span>
              <span class="uv-go" aria-hidden="true"><uv-icon name="arrow-right" /></span>
            </p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
